name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves and validates the release version.
  prepare:
    name: Resolve release version
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and validate version
        id: resolve
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RELEASE_TAG#v}"
          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          test "$VERSION" = "$CONFIG_VERSION" || {
            echo "Tag $RELEASE_TAG does not match app version $CONFIG_VERSION"
            exit 1
          }

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Builds Windows, macOS Intel, macOS Apple Silicon, and Linux.
  build:
    name: Build (${{ matrix.os_name }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: windows-latest
            os_name: windows
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis

          - platform: macos-latest
            os_name: macos-x64
            rust_target: x86_64-apple-darwin
            bundles: app,dmg

          - platform: macos-latest
            os_name: macos-aarch64
            rust_target: aarch64-apple-darwin
            bundles: app,dmg

          - platform: ubuntu-22.04
            os_name: linux
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux system dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bunx tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # Windows installer
      - name: Prepare release artifacts (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          NSIS_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis"

          mkdir -p release-artifacts

          SETUP="$(find "$NSIS_DIR" -maxdepth 1 -name '*-setup.exe' -print -quit)"

          test -n "$SETUP" || {
            echo "Windows installer was not found."
            exit 1
          }

          cp "$SETUP" "release-artifacts/Xuro_${VERSION}_x64-setup.exe"

      # macOS installers
      - name: Prepare release artifacts (macOS)
        if: matrix.os_name == 'macos-x64' || matrix.os_name == 'macos-aarch64'
        shell: bash
        run: |
          ARCH="${{ matrix.os_name == 'macos-x64' && 'x64' || 'aarch64' }}"

          DMG_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"

          mkdir -p release-artifacts

          DMG="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' -print -quit)"

          test -n "$DMG" || {
            echo "macOS DMG was not found."
            exit 1
          }

          cp "$DMG" "release-artifacts/Xuro_${VERSION}_${ARCH}.dmg"

      # Linux installers
      - name: Prepare release artifacts (Linux)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          APPIMAGE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage"
          DEB_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb"

          mkdir -p release-artifacts

          DEB="$(find "$DEB_DIR" -maxdepth 1 -name '*.deb' -print -quit)"

          test -n "$DEB" || {
            echo "Linux DEB package was not found."
            exit 1
          }

          cp "$DEB" "release-artifacts/Xuro_${VERSION}_amd64.deb"

          APPIMAGE="$(find "$APPIMAGE_DIR" -maxdepth 1 -name '*.AppImage' -print -quit)"

          test -n "$APPIMAGE" || {
            echo "Linux AppImage was not found."
            exit 1
          }

          cp "$APPIMAGE" "release-artifacts/Xuro_${VERSION}_amd64.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xuro-${{ matrix.os_name }}-${{ env.VERSION }}
          path: release-artifacts/
          if-no-files-found: error

  # Collects all platform builds and publishes one GitHub Release.
  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xuro-*-${{ env.VERSION }}
          path: merged-artifacts
          merge-multiple: true

      - name: Publish to GitHub release
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Xuro ${VERSION}"

          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            merged-artifacts/* \
            --clobber
